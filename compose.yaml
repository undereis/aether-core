name: aether

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: aether-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aether}
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aether_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aether-network

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: aether-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - aether_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aether-network

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.15.3}
    container_name: aether-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - aether_qdrant_data:/qdrant/storage
    networks:
      - aether-network

volumes:
  aether_postgres_data:
  aether_redis_data:
  aether_qdrant_data:

networks:
  aether-network:
    driver: bridge

