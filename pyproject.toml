[project]
name = "aether-workspace"
version = "0.1.0"
description = "Aether Python workspace."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "black>=24.10.0,<27.0.0",
  "httpx>=0.27.2,<1.0.0",
  "mypy>=1.13.0,<2.0.0",
  "pre-commit>=4.0.0,<5.0.0",
  "pytest>=8.3.0,<10.0.0",
  "pytest-cov>=5.0.0,<8.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aether_backend"]
